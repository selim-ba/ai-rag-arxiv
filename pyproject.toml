[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Agentic RAG over arXiv papers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "openai>=1.40",
    "numpy>=1.26",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Ingestion is optional at RUNTIME. The API reads a prebuilt index; it never parses a PDF
# and never counts tokens, so `pymupdf` (63 MB in the image) and `tiktoken` (4 MB) are
# dead weight in a container that only answers questions. Measured, not assumed: the
# imports live solely in `ingestion/pdf_parser.py` and `ingestion/chunker.py`, and
# `ingestion/__init__.py` is empty, so importing `Chunk` does not drag the parser in.
#
# `feedparser` stays a core dependency on purpose - `agent/tools.py` reaches the arXiv API
# at request time to answer questions about papers outside the index.
#
# `make ingest` and `make index` need this extra. So do the tests.
ingest = [
    "pymupdf>=1.24",
    "tiktoken>=0.7",
]
# Reranking is optional: sentence-transformers pulls in torch, which is large and only
# needed if you actually rerank. `pip install -e ".[rerank]"` when you want it.
rerank = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() in argument defaults is the idiomatic FastAPI pattern, not the
# mutable-default bug B008 is looking for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
